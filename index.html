<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tube Atlas · YouTube 排行榜</title><link rel="stylesheet" href="style.css">
<header><b class="brand"><i>▶</i> Tube Atlas</b><span>YouTube 数据排行</span></header>
<main><section class="intro"><div><h1>YouTube 排行榜<span>.</span></h1><p>每天北京时间 08:00 更新</p></div><div class="bars" aria-hidden="true"></div></section>
<nav aria-label="选择榜单"><button data-board="channels" aria-pressed="true">频道订阅榜</button><button data-board="videos">累计播放榜</button><button data-board="daily">24 小时增量榜</button></nav>
<section class="panel"><div class="tools"><div><h2 id="heading">频道订阅榜</h2><small id="updated"></small></div><input type="search" id="search" aria-label="搜索当前榜单" placeholder="搜索名称或频道"></div><div class="labels"><span>排名</span><span id="itemLabel">频道</span><span id="metric">订阅数</span></div><div id="rows"></div><p role="status" id="status"></p></section></main>
<script src="app.js" defer></script></html>
